# FragPipe five normal cerebellum control input parameters

# FASTA files (predicted peptides from impact_trial_cwl tumor-specific filtering)
query_fasta:
  class: File
  path: /home/ubuntu/impact_trial_cwl/outputs/impact002/BA_RV4HJE2C_BA_EBEMAETC_taskid_tumor_specific_filtered.fasta

uniprot_canonical_fasta:
  class: File
  path: ../data/references/UP000005640_9606.fasta.gz

# FragPipe configuration files
workflow_file:
  class: File
  path: ../data/impact002-LFQ-MBR.workflow.txt

manifest_file:
  class: File
  path: ../data/nc.fp-manifest.txt

# mzML source directory (already-converted mzML files)
mzml_source_dir:
  class: Directory
  path: /home/ubuntu/fragpipe_cwl/data/bti-private-us-east-1-prd-impact-trial/source/

# Input type specification
input_type: "mzml"  # one of: raw, mzml_gz, mzml

run_subset: false
subset_pattern: ""

# Base name for all output files
output_basename: "Control_vs_IMPACT002"


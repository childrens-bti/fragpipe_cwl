# FragPipe Local Workflow Input Parameters
# This file specifies all required inputs for the fragpipe.cwl workflow

# FASTA files
query_fasta:
  class: File
  path: ../data/custom_filtered.fasta

uniprot_canonical_fasta:
  class: File
  path: ../data/references/UP000005640_9606.fasta.gz

# FragPipe configuration files
workflow_file:
  class: File
  path: ../data/PDC000180customworkflow.workflow

manifest_file:
  class: File
  path: ../data/PDC000180filesmanifest.fp-manifest

# mzML source directory (mounted Cavatica)
mzml_source_dir:
  class: Directory
  path: /home/ubuntu/fragpipe_cwl/data/cavatica-data/projects/harenzaj/proteomics
  
# hope cohort: /home/ubuntu/fragpipe_cwl/data/cavatica-data/projects/harenzaj/hope-proteomics/HOPE_TotalProteome_mzML

run_subset: false  # Set to true to process only first experiment (01C prefix)
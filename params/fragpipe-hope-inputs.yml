# FragPipe Local Workflow Input Parameters
# This file specifies all required inputs for the fragpipe.cwl workflow

# FASTA files
query_fasta:
  class: File
  path: ../data/custom_filtered.fasta

uniprot_canonical_fasta:
  class: File
  path: ../data/references/UP000005640_9606.fasta.gz

# FragPipe configuration files
workflow_file:
  class: File
  path: ../data/HOPEproteome_TMT11workflow.workflow

manifest_file:
  class: File
  path: ../data/HOPE-files-manifest.fp-manifest

# mzML source directory (mounted Cavatica)
mzml_source_dir:
  class: Directory
  path: /home/ubuntu/fragpipe_cwl/data/cavatica-data/projects/harenzaj/hope-proteomics/HOPE_TotalProteome_mzML

# Input type specification
input_type: "mzml_gz"  # Type of input files: "raw", "mzml_gz", or "mzml"
  
# Processing options
run_subset: true  # Set to true to process only files matching subset_pattern
subset_pattern: "01C"  # Pattern to match - "01C" processes only */01C*/ directories

# FragPipe IMPACT002-Run1 input parameters
# Aligned to fragpipe.cwl (includes optional control peptide filtering)

# FASTA files
query_fasta:
  class: File
  path: /home/ubuntu/impact_trial_cwl/outputs/impact002/BA_RV4HJE2C_BA_EBEMAETC_taskid_tumor_specific_filtered.fasta

uniprot_canonical_fasta:
  class: File
  path: ../data/references/UP000005640_9606.fasta.gz

# FragPipe configuration files
workflow_file:
  class: File
  path: ../data/impact002-LFQ-MBR.workflow.txt

manifest_file:
  class: File
  path: ../data/impact002.fp-manifest.txt

# mzML source directory (already-converted mzML files)
mzml_source_dir:
  class: Directory
  path: /home/ubuntu/fragpipe_cwl/data/IMPACT002-Run1_mzmls/

# Input type specification
input_type: "mzml"  # one of: raw, mzml_gz, mzml

run_subset: false
subset_pattern: ""

# Base name for all output files
output_basename: "IMPACT002-Run1"

# Optional control peptide table for overlap filtering
control_combined_peptide:
  class: File
  path: ../outputs/GtexFilter_impact-trial-Controls/Control_vs_IMPACT002_combined_peptide.tsv

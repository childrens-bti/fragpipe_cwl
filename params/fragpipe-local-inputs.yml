# FragPipe Local Workflow Input Parameters
# This file specifies all required inputs for the fragpipe-local.cwl workflow

# FASTA files
query_fasta:
  class: File
  path: ../data/custom.fasta

uniprot_canonical_fasta:
  class: File
  path: ../data/references/UP000005640_9606.fasta.gz

# FragPipe configuration files
workflow_file:
  class: File
  path: ../data/HOPEproteome_TMT11workflow.workflow

manifest_file:
  class: File
  path: ../data/HOPE-files-manifest.fp-manifest

# Cavatica project settings
cohort: hope  # Options: 'hope' or 'cptac'

run_subset: false  # Set to true to process only first experiment (01C prefix)

# FragPipe Workflow Input Parameters - RAW FILE Example
# This file demonstrates how to process Thermo Fisher .raw files
# Testing with IMPACT trial data for patient N849

# FASTA files
query_fasta:
  class: File
  path: ../data/custom_filtered.fasta

uniprot_canonical_fasta:
  class: File
  path: ../data/references/UP000005640_9606.fasta.gz

# FragPipe configuration files
workflow_file:
  class: File
  path: ../data/PDC000180customworkflow.workflow

manifest_file:
  class: File
  path: ../data/PDC000180filesmanifest.fp-manifest

# Source directory containing .raw files
# The workflow will automatically:
#   1. Detect that files are .raw format
#   2. Convert them to mzML using msconvert
#   3. Generate the FragPipe manifest
mzml_source_dir:
  class: Directory
  path: /path/to/your/raw/files/directory

# Processing options
run_subset: false  # Set to true to process only files matching subset_pattern
subset_pattern: "N849"  # Pattern - for .raw files, matches filename prefix (e.g., files starting with "01C")

# Note: skip_gunzip parameter is deprecated and ignored
# The workflow now auto-detects input file type (.raw, .mzML.gz, or .mzML)

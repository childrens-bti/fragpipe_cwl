# FragPipe Local Workflow Input Parameters
# This file specifies all required inputs for the fragpipe.cwl workflow

# FASTA files
query_fasta:
  class: File
  path: ../data/custom_filtered.fasta

uniprot_canonical_fasta:
  class: File
  path: ../data/references/UP000005640_9606.fasta.gz

# FragPipe configuration files
workflow_file:
  class: File
  path: ../data/PDC000180customworkflow.workflow

manifest_file:
  class: File
  path: ../data/PDC000180filesmanifest.fp-manifest

# mzML source directory (mounted Cavatica)
mzml_source_dir:
  class: Directory
  path: /home/ubuntu/fragpipe_cwl/data/cavatica-data-cptac/projects/harenzaj/proteomics
  
# hope cohort: /home/ubuntu/fragpipe_cwl/data/cavatica-data/projects/harenzaj/hope-proteomics/HOPE_TotalProteome_mzML

# Input type specification
input_type: "mzml_gz"  # Type of input files: "raw", "mzml_gz", or "mzml"

# Processing options
run_subset: true  # Set to true to process only files matching subset_pattern
subset_pattern: "01CBTTC_PBT_Proteome_HMS_20180626"  # Pattern to match in directory paths (default: "01C" for backward compatibility)

# Output file naming
output_basename: "01CBTTC_PBT_Proteome_HMS_20180626"  # Base name for all output files